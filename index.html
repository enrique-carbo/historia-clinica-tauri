<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/fichio.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fichio Care</title>
    <script>
      // Aplica el tema antes del primer paint (mismo criterio que
      // useThemeStore: localStorage "fichio-theme" → prefers-color-scheme).
      (function () {
        try {
          var t = localStorage.getItem("fichio-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
